[package]
name = "solana_flash_swap"
version = "0.1.0"
edition = "2021"
authors = ["methun404 <methun404@users.noreply.github.com>"]
description = "A high-performance Solana swap library optimized for Jupiter and Helius."
license = "MIT"
repository = "https://github.com/methun404/solana-flash-swap"
readme = "README.md"
keywords = ["solana", "jupiter", "swap", "trading-bot", "pyo3"]
categories = ["cryptography::cryptocurrencies", "api-bindings"]

# -------------------------------
# LIB CONFIG (Required for Python)
# -------------------------------
[lib]
name = "solana_flash_swap"
crate-type = ["cdylib"]   # Required for Python extension

# -------------------------------
# DEPENDENCIES
# -------------------------------
[dependencies]

# 1️⃣ Async Runtime (Core Engine)
tokio = { version = "1.35", features = ["full"] }

# 2️⃣ Solana Core (Stable Mainnet Version)
solana-sdk = "1.18"
solana-client = "1.18"
solana-program = "1.18"
solana-transaction-status = "1.18.26"

# 3️⃣ SPL Token Support
spl-token = "4.0"
spl-associated-token-account = "2.0"

# 4️⃣ HTTP Client (Jupiter API)
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.5"

# 5️⃣ Serialization & Encoding
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
base64 = "0.21"

# 6️⃣ Error Handling
anyhow = "1.0"

# 7️⃣ Logging
log = "0.4"
env_logger = "0.10"

# 8️⃣ Configuration
dotenv = "0.15"

# -----------------------------------
# 🔥 Python Binding (Max Speed Setup)
# -----------------------------------
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }

# -------------------------------
# DEV DEPENDENCIES
# -------------------------------
[dev-dependencies]
tokio-test = "0.4"

# -------------------------------
# RELEASE OPTIMIZATION (IMPORTANT)
# -------------------------------
[profile.release]
opt-level = 3        # Maximum optimization
lto = true           # Link Time Optimization
codegen-units = 1    # Better optimization
panic = "abort"      # Smaller & faster binary
strip = true         # Remove debug symbols